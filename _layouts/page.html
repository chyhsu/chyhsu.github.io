---
layout: default
---
<article class="site-shell prose-page">
  <header class="page-header">
    <p class="eyebrow">{{ page.eyebrow | default: site.title }}</p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
